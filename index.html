<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retris - WASM-4</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="gameFrame" src="game.html" allow="clipboard-read; clipboard-write; autoplay; gamepad"></iframe>

  <script>
    const frame = document.getElementById('gameFrame');
    
    function formatNetplayLink(text) {
      if (text && text.includes('?netplay=')) {
        const url = new URL(text);
        const code = url.searchParams.get('netplay');
        if (code) {
          return 'https://wasm4.org' + code;
        }
      }
      return text;
    }

    frame.addEventListener('load', () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      if (win.navigator && win.navigator.clipboard) {
        win.navigator.clipboard.writeText = function(text) {
          const fixed = formatNetplayLink(text);
          return navigator.clipboard.writeText(fixed);
        };
      }

      doc.addEventListener('copy', (e) => {
        const selected = win.getSelection().toString();
        if (selected.includes('?netplay=')) {
          e.preventDefault();
          const fixed = formatNetplayLink(selected);
          e.clipboardData.setData('text/plain', fixed);
        }
      });
    });
  </script>
</body>
</html>
