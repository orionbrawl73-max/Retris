<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retris - WASM-4</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="gameFrame" src="game.html" allow="clipboard-read; clipboard-write; autoplay; gamepad"></iframe>

  <script>
    const frame = document.getElementById('gameFrame');
    
    function formatNetplayLink(text) {
      if (text && text.includes('netplay=')) {
        const url = new URL(text);
        const code = url.searchParams.get('netplay');
        if (code) {
          return 'https://wasm4.org\x23' + code;
        }
      }
      return text;
    }

    function hookClipboard() {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      if (!win || !doc) return;

      if (win.navigator && win.navigator.clipboard && !win.navigator.clipboard._hooked) {
        win.navigator.clipboard.writeText = function(text) {
          return navigator.clipboard.writeText(formatNetplayLink(text));
        };
        win.navigator.clipboard._hooked = true;
      }

      if (!doc._copyHooked) {
        doc.addEventListener('copy', (e) => {
          const selected = win.getSelection().toString();
          if (selected.includes('netplay=')) {
            e.preventDefault();
            e.clipboardData.setData('text/plain', formatNetplayLink(selected));
          }
        });
        doc._copyHooked = true;
      }
    }

    frame.addEventListener('load', hookClipboard);
    setInterval(hookClipboard, 300);
  </script>
</body>
</html>
